name: CI Build & Schema Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-backend:
    name: Backend Schema Validation & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate --schema=prisma/schema.prisma
        env:
          DATABASE_URL: "postgresql://ci_dummy:ci_dummy@localhost:5432/ci_dummy?sslmode=disable"
          DIRECT_URL: "postgresql://ci_dummy:ci_dummy@localhost:5432/ci_dummy?sslmode=disable"

      - name: Run Cache & Unit Verifications
        run: node scripts/verify-cache-unit.cjs

  build-frontend:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build
