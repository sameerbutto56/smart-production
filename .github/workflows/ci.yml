name: CI Build & Schema Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-backend:
    name: Backend Schema Validation & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm --prefix backend ci

      - name: Validate Prisma Schema
        run: npx --prefix backend prisma validate --schema=backend/prisma/schema.prisma

      - name: Run Cache & Unit Verifications
        run: node backend/scripts/verify-cache-unit.cjs

  build-frontend:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: Build Frontend
        run: npm --prefix frontend run build
